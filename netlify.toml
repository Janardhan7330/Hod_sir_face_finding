[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# To connect the deployed FastAPI backend, set VITE_API_URL in the Netlify UI
# (e.g. https://your-backend.example.com/api/v1), or proxy /api/* to it here:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.example.com/api/:splat"
#   status = 200
#   force = true

# Single-page app fallback so client-side routes (e.g. /login) don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
